name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tag matches version
        run: python scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"

      - name: Ruff
        run: python -m ruff check bin tests

      - name: Pytest
        run: python -m pytest -q

  windows-exe:
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare code signing
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGN_PFX_BASE64) {
            Write-Host "No WINDOWS_SIGN_PFX_BASE64 secret; skipping code signing."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "hostpulse.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          "HOSTPULSE_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "HOSTPULSE_SIGN_PASSWORD=$env:WINDOWS_SIGN_PASSWORD" >> $env:GITHUB_ENV

      - name: Build EXE package
        shell: pwsh
        run: |
          .\build_exe.ps1
          $pkg = "dist\windows\HostPulse"
          if (-not (Test-Path "$pkg\HostPulse.exe")) { throw "HostPulse.exe missing in $pkg" }
          if (-not (Test-Path "$pkg\_internal")) { throw "_internal folder missing (onedir layout required)" }
          if (-not (Test-Path "$pkg\config\baseline.json")) { throw "config\baseline.json missing (required for report deltas)" }
          Compress-Archive -Path "$pkg\*" -DestinationPath "dist\HostPulse-windows.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: HostPulse-windows
          path: dist/HostPulse-windows.zip

  linux-package:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Linux package + smoke
        run: |
          # HOSTPULSE_PYTHON expects deps already installed (same as CI / air-gap override).
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          chmod +x build_linux.sh scripts/hostpulse.sh
          ./build_linux.sh
          test -f dist/HostPulse-linux.zip
          test -x dist/linux/HostPulse/hostpulse.sh
          test -f dist/linux/HostPulse/config/baseline.json
          HOSTPULSE_PYTHON=python ./dist/linux/HostPulse/hostpulse.sh run --quick --production-safe --out /tmp/hostpulse-release.html
          test -f /tmp/hostpulse-release.html

      - uses: actions/upload-artifact@v7
        with:
          name: HostPulse-linux
          path: dist/HostPulse-linux.zip

  release:
    needs: [windows-exe, linux-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: HostPulse-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum HostPulse-windows.zip HostPulse-linux.zip | tee SHA256SUMS.txt
          {
            echo "## Checksums (SHA256)"
            echo ""
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo ""
            echo "Windows onedir also ships \`SHA256.txt\` for \`HostPulse.exe\` inside the zip."
          } > release_checksums.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: dist/release_checksums.md
          files: |
            dist/HostPulse-windows.zip
            dist/HostPulse-linux.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
