name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build EXE package
        shell: pwsh
        run: |
          .\build_exe.ps1
          $pkg = "dist\windows\HostPulse"
          if (-not (Test-Path "$pkg\HostPulse.exe")) { throw "HostPulse.exe missing in $pkg" }
          Compress-Archive -Path "$pkg\*" -DestinationPath "dist\HostPulse-windows.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/HostPulse-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
