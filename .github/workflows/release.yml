name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare code signing
        if: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "hostpulse.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          "HOSTPULSE_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "HOSTPULSE_SIGN_PASSWORD=$env:WINDOWS_SIGN_PASSWORD" >> $env:GITHUB_ENV

      - name: Build EXE package
        shell: pwsh
        run: |
          .\build_exe.ps1
          $pkg = "dist\windows\HostPulse"
          if (-not (Test-Path "$pkg\HostPulse.exe")) { throw "HostPulse.exe missing in $pkg" }
          if (-not (Test-Path "$pkg\_internal")) { throw "_internal folder missing (onedir layout required)" }
          Compress-Archive -Path "$pkg\*" -DestinationPath "dist\HostPulse-windows.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: HostPulse-windows
          path: dist/HostPulse-windows.zip

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Linux package
        run: |
          chmod +x build_linux.sh scripts/hostpulse.sh
          ./build_linux.sh
          test -f dist/HostPulse-linux.zip
          test -x dist/linux/HostPulse/hostpulse.sh

      - uses: actions/upload-artifact@v7
        with:
          name: HostPulse-linux
          path: dist/HostPulse-linux.zip

  release:
    needs: [windows-exe, linux-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: HostPulse-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/HostPulse-windows.zip
            dist/HostPulse-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
