name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check bin tests

      - name: Compile
        run: python -m compileall -q bin

      - name: Pytest
        run: python -m pytest -q

      - name: Linux package smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build_linux.sh scripts/hostpulse.sh
          ./build_linux.sh
          HOSTPULSE_PYTHON=python ./dist/linux/HostPulse/hostpulse.sh run --quick --production-safe --out /tmp/hostpulse-ci.html
          test -f /tmp/hostpulse-ci.html
